<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detector Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            justify-content: center;
        }
        
        .tab {
            padding: 12px 30px;
            background: #e0e0e0;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 16px;
        }
        
        .tab.active {
            background: #667eea;
            color: white;
        }
        
        .tab:hover:not(.active) {
            background: #d0d0d0;
        }
        
        .input-section {
            margin-bottom: 20px;
        }
        
        .url-input, textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        
        .url-input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            height: 150px;
            resize: vertical;
        }
        
        .hint {
            color: #888;
            font-size: 14px;
            margin-top: 8px;
        }
        
        .btn-primary {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 30px 0;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .result-container {
            display: none;
            margin-top: 30px;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .verdict-box {
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 25px;
        }
        
        .verdict-box.real {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            border: 2px solid #28a745;
        }
        
        .verdict-box.fake {
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            border: 2px solid #dc3545;
        }
        
        .verdict-box.uncertain {
            background: linear-gradient(135deg, #fff3cd 0%, #ffeeba 100%);
            border: 2px solid #ffc107;
        }
        
        .verdict-icon {
            font-size: 60px;
            margin-bottom: 10px;
        }
        
        .verdict-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .verdict-box.real .verdict-title { color: #155724; }
        .verdict-box.fake .verdict-title { color: #721c24; }
        .verdict-box.uncertain .verdict-title { color: #856404; }
        
        .credibility-score {
            font-size: 48px;
            font-weight: bold;
            margin: 15px 0;
        }
        
        .score-bar {
            width: 100%;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }
        
        .score-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 1s ease-out;
        }
        
        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }
        
        .analysis-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }
        
        .analysis-card h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 14px;
        }
        
        .detail-label {
            color: #666;
        }
        
        .detail-value {
            font-weight: bold;
            color: #333;
        }
        
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .badge-success { background: #d4edda; color: #155724; }
        .badge-danger { background: #f8d7da; color: #721c24; }
        .badge-warning { background: #fff3cd; color: #856404; }
        .badge-info { background: #d1ecf1; color: #0c5460; }
        
        .reasons-list {
            list-style: none;
            margin-top: 10px;
        }
        
        .reasons-list li {
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
        }
        
        .reasons-list li:before {
            content: "✓ ";
            color: #28a745;
            font-weight: bold;
        }
        
        .warnings-list li:before {
            content: "⚠ ";
            color: #ffc107;
            font-weight: bold;
        }
        
        .article-preview {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .article-preview h4 {
            color: #555;
            margin-bottom: 10px;
        }
        
        .article-preview p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
            border-left: 4px solid #dc3545;
        }
        
        .hidden {
            display: none !important;
        }
        
        .sources-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        
        .source-tag {
            background: #e3f2fd;
            color: #1976d2;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Fake News Detector Pro</h1>
        <p class="subtitle">AI-Powered Fact Checking with ML Model + Gemini AI + Source Verification</p>
        
        <div class="tabs">
            <button class="tab active" id="tabUrl">🔗 Check URL</button>
            <button class="tab" id="tabText">📝 Check Text</button>
        </div>
        
        <div id="urlSection" class="input-section">
            <input type="url" id="urlInput" class="url-input" 
                   placeholder="Paste news link here (Facebook, Twitter, news sites...)">
            <p class="hint">Works with: Facebook, X/Twitter, Reddit, News sites, Blogs, YouTube</p>
        </div>
        
        <div id="textSection" class="input-section hidden">
            <textarea id="textInput" placeholder="Paste the news article text here..."></textarea>
            <p class="hint">Paste the full article text for best results (minimum 50 characters)</p>
        </div>
        
        <button class="btn-primary" id="analyzeBtn">🔍 Analyze Now</button>
        
        <div class="error-message" id="errorMsg"></div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing with AI...</p>
            <p id="loadingStatus">Initializing...</p>
        </div>
        
        <div class="result-container" id="resultContainer">
            <!-- Results will be inserted here -->
        </div>
    </div>

    <script>
        let currentTab = 'url';
        
        const tabUrl = document.getElementById('tabUrl');
        const tabText = document.getElementById('tabText');
        const urlSection = document.getElementById('urlSection');
        const textSection = document.getElementById('textSection');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const resultContainer = document.getElementById('resultContainer');
        
        tabUrl.addEventListener('click', () => switchTab('url'));
        tabText.addEventListener('click', () => switchTab('text'));
        analyzeBtn.addEventListener('click', analyzeContent);
        
        function switchTab(tab) {
            currentTab = tab;
            if (tab === 'url') {
                tabUrl.classList.add('active');
                tabText.classList.remove('active');
                urlSection.classList.remove('hidden');
                textSection.classList.add('hidden');
            } else {
                tabText.classList.add('active');
                tabUrl.classList.remove('active');
                textSection.classList.remove('hidden');
                urlSection.classList.add('hidden');
            }
            hideResults();
        }
        
        function hideResults() {
            resultContainer.style.display = 'none';
            document.getElementById('errorMsg').style.display = 'none';
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => errorDiv.style.display = 'none', 5000);
        }
        
        function updateLoadingStatus(text) {
            document.getElementById('loadingStatus').textContent = text;
        }
        
        async function analyzeContent() {
            const url = document.getElementById('urlInput').value.trim();
            const text = document.getElementById('textInput').value.trim();
            
            if (currentTab === 'url' && !url) {
                showError('Please enter a URL');
                return;
            }
            if (currentTab === 'text' && text.length < 50) {
                showError('Please enter at least 50 characters of text');
                return;
            }
            
            analyzeBtn.disabled = true;
            document.getElementById('loading').style.display = 'block';
            hideResults();
            
            try {
                updateLoadingStatus('Connecting to AI analysis engine...');
                
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        url: currentTab === 'url' ? url : '',
                        text: currentTab === 'text' ? text : ''
                    })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    showError(data.error);
                    return;
                }
                
                displayResults(data);
                
            } catch (error) {
                showError('Connection error: ' + error.message);
            } finally {
                analyzeBtn.disabled = false;
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        function displayResults(data) {
            const verdict = data.final_verdict;
            
            let html = `
                <div class="verdict-box ${verdict.verdict_class}">
                    <div class="verdict-icon">${verdict.verdict_icon}</div>
                    <div class="verdict-title">${verdict.verdict}</div>
                    <div class="credibility-score">${verdict.credibility_score}%</div>
                    <div style="color: #666; font-size: 14px;">Credibility Score</div>
                    <div class="score-bar">
                        <div class="score-fill" style="width: ${verdict.credibility_score}%; background: ${verdict.verdict_class === 'real' ? '#28a745' : verdict.verdict_class === 'fake' ? '#dc3545' : '#ffc107'}"></div>
                    </div>
                </div>
            `;
            
            if (verdict.article_title) {
                html += `
                    <div class="article-preview">
                        <h4>📰 Article: ${verdict.article_title}</h4>
                        <p>${verdict.article_excerpt}</p>
                    </div>
                `;
            }
            
            html += '<div class="analysis-grid">';
            
            // ML Analysis
            if (data.ml_analysis && data.ml_analysis.prediction !== 'N/A') {
                const ml = data.ml_analysis;
                html += `
                    <div class="analysis-card">
                        <h3>🤖 ML Model Analysis</h3>
                        <div class="detail-row">
                            <span class="detail-label">Prediction:</span>
                            <span class="detail-value">
                                <span class="badge ${ml.prediction === 'REAL' ? 'badge-success' : 'badge-danger'}">${ml.prediction}</span>
                            </span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Confidence:</span>
                            <span class="detail-value">${ml.confidence}%</span>
                        </div>
                    </div>
                `;
            }
            
            // Gemini Analysis
            if (data.gemini_analysis && !data.gemini_analysis.error) {
                const gemini = data.gemini_analysis;
                html += `
                    <div class="analysis-card">
                        <h3>🧠 Gemini AI Analysis</h3>
                        <div class="detail-row">
                            <span class="detail-label">Verdict:</span>
                            <span class="detail-value">
                                <span class="badge ${gemini.verdict === 'REAL' ? 'badge-success' : gemini.verdict === 'FAKE' ? 'badge-danger' : 'badge-warning'}">${gemini.verdict}</span>
                            </span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Confidence:</span>
                            <span class="detail-value">${gemini.confidence}%</span>
                        </div>
                        <p style="margin-top: 10px; font-size: 13px; color: #666;">${gemini.reasoning}</p>
                    </div>
                `;
            }
            
            // Source Verification
            if (data.source_verification && !data.source_verification.error) {
                const src = data.source_verification;
                html += `
                    <div class="analysis-card">
                        <h3>📡 Source Verification</h3>
                        <div class="detail-row">
                            <span class="detail-label">Method:</span>
                            <span class="detail-value">${src.api_used || 'News Database'}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Articles Found:</span>
                            <span class="detail-value">${src.total_articles || src.count || 0}</span>
                        </div>
                        ${src.sources && src.sources.length > 0 ? `
                            <div style="margin-top: 10px;">
                                <div class="detail-label">Sources:</div>
                                <div class="sources-list">
                                    ${src.sources.map(s => `<span class="source-tag">${s}</span>`).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }
            
            // Domain Check
            if (data.domain_check && data.domain_check.domain) {
                const dom = data.domain_check;
                const statusClass = dom.status === 'trusted' ? 'badge-success' : dom.status === 'fake' ? 'badge-danger' : 'badge-warning';
                html += `
                    <div class="analysis-card">
                        <h3>🌐 Domain Analysis</h3>
                        <div class="detail-row">
                            <span class="detail-label">Domain:</span>
                            <span class="detail-value">${dom.domain}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Status:</span>
                            <span class="detail-value">
                                <span class="badge ${statusClass}">${dom.status.toUpperCase()}</span>
                            </span>
                        </div>
                        <p style="margin-top: 10px; font-size: 13px; color: #666;">${dom.info}</p>
                    </div>
                `;
            }
            
            // Style Analysis
            if (data.style_analysis) {
                const style = data.style_analysis;
                html += `
                    <div class="analysis-card">
                        <h3>✍️ Writing Style Analysis</h3>
                        <div class="detail-row">
                            <span class="detail-label">Word Count:</span>
                            <span class="detail-value">${style.word_count}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Exclamations:</span>
                            <span class="detail-value">${style.exclamation_marks}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Sensational Words:</span>
                            <span class="detail-value">${style.sensational_words}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Sensationalism Score:</span>
                            <span class="detail-value">${style.sensationalism_score}/100</span>
                        </div>
                    </div>
                `;
            }
            
            html += '</div>'; // Close analysis-grid
            
            // Reasons and Warnings
            if (verdict.reasons && verdict.reasons.length > 0) {
                html += `
                    <div class="analysis-card" style="margin-top: 20px; border-left-color: #28a745;">
                        <h3>✅ Positive Indicators</h3>
                        <ul class="reasons-list">
                            ${verdict.reasons.map(r => `<li>${r}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }
            
            if (verdict.warnings && verdict.warnings.length > 0) {
                html += `
                    <div class="analysis-card" style="margin-top: 20px; border-left-color: #dc3545;">
                        <h3>⚠️ Warning Signs</h3>
                        <ul class="reasons-list warnings-list">
                            ${verdict.warnings.map(w => `<li>${w}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }
            
            resultContainer.innerHTML = html;
            resultContainer.style.display = 'block';
            resultContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    </script>
</body>
</html>
